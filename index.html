async function micTest(){if(busy)return;closeTest();speechSynthesis.cancel();let serial=testSerial, out=document.getElementById('testStatus'), meter=document.getElementById('soundMeter');out.textContent='Allow your microphone. Then speak.';try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('Microphone access is unavailable on this page.');let stream=await navigator.mediaDevices.getUserMedia({audio:true});if(serial!==testSerial){stream.getTracks().forEach(t=>t.stop());return}testStream=stream;testContext=new (window.AudioContext||window.webkitAudioContext)();await testContext.resume();if(serial!==testSerial)return;let a=testContext.createAnalyser();a.fftSize=1024;testContext.createMediaStreamSource(stream).connect(a);let buf=new Float32Array(a.fftSize),peak=0;function tick(){if(serial!==testSerial)return;a.getFloatTimeDomainData(buf);let rms=Math.sqrt(buf.reduce((sum,v)=>sum+v*v,0)/buf.length);peak=Math.max(peak,rms);meter.value=Math.min(100,rms*500);out.textContent=peak>.015?'Sound detected! Stop test, then try speaking.':'Speak into your microphone. Is the bar moving?';testFrame=requestAnimationFrame(tick)}tick()}catch(e){if(serial===testSerial){closeTest();out.textContent='Microphone test failed: '+e.name+' — '+e.message}}}
function testPanel(){return `<div style="margin:12px auto;max-width:500px;background:#f1f6f3;padding:12px;border-radius:14px"><button class="secondary" onclick="micTest()">Microphone Test</button><button class="secondary" onclick="closeTest();document.getElementById('testStatus').textContent='Test stopped.';document.getElementById('soundMeter').value=0">Stop test</button><progress id="soundMeter" max="100" value="0"></progress><p id="testStatus" class="note" aria-live="polite">Check your microphone first.</p></div>`}
function home(){stop();badge();app.innerHTML=`<div class="hero"><div class="emoji">CITY / 01</div><h1>Food City</h1><p>Speak to unlock. Listen to discover. Write to remember.</p><label>Class: <input id="classId" value="${esc(data.classId||'')}" placeholder="6A"></label><label>Number: <input id="number" value="${esc(data.number||'')}" placeholder="01"></label><p id="loginError"></p><button onclick="enter()">Start your adventure!</button></div><div class="panel"><h2>Training Camp</h2><p>Listen and practice.</p>${testPanel()}<div class="foods">${foods.map((f,i)=>`<button class="secondary" onclick="say(foods[${i}])">${icons[i]} ${f} 🔊</button>`).join('')}</div><button onclick="say(Q)">🔊 Listen to the question</button><button onclick="say(A('pizza'))">🔊 Listen to the answer</button><button class="secondary" onclick="passport()">Print your mission logs</button></div>`}
function map(){stop();badge();queueSync();app.innerHTML=`<button class="secondary" onclick="home()">Home</button><button class="secondary" onclick="queueSync()">Save progress</button><button class="secondary" onclick="passport()">Print mission logs</button><h1>Adventure Map</h1><p>Hello, ${esc(data.player||'Explorer')}! Choose a mission.</p>`;for(let [title,start,end] of [['City Missions',0,6],['Challenge District',6,12],['Master Chef',12,13]]){app.innerHTML+=`<h2>${title}</h2><div class="grid">${names.slice(start,end).map((n,j)=>{let i=start+j,locked=i>=6&&!basic()||i===12&&advanced()<3;return `<button class="tile" ${locked?'disabled':''} onclick="start(${i})"><div class="emoji">${scene(i)}</div><strong>${n}</strong>${data.done[i]?'✓ Complete · Play again':locked?'🔒 '+(i===12?'Finish 3 challenges':'Finish City Missions'):'Ready to play'}</button>`}).join('')}</div>`}}
const order=(f,extra={})=>({kind:'order',f,prompt:Q,...extra}),ask=(f,person='Guest')=>({kind:'ask',f,person,prompt:'Ask your guest.'}),listen=(f,person)=>({kind:'order',f,prompt:Q,instruction:`You are ${person}. Order the same food.`,hidden:true});function build(i){let r=()=>rand();switch(i){case 0:return [order('pizza'),order('steak')];case 1:return [order('dumplings'),order('noodles')];case 2:return [ask('rice','Alex'),ask('soup','Mia')];case 3:return [ask('sandwiches','Sam'),order('sandwiches'),ask('French fries','Jordan'),order('French fries')];case 4:return people.map(p=>ask(r(),p));case 5:return [ask(r(),'Alex'),order('rice'),ask(r(),'Mia'),order('soup'),ask(r(),'Jordan'),order('pizza',{hidden:true,instruction:'Order pizza.'})];case 6:return Array.from({length:3},()=>{let m=shuffle(foods).slice(0,3);return order(m[0],{allowed:m,prompt:`We have ${m.join(', ')}. ${Q}`,hidden:true,instruction:'Listen. Order one food.'})});case 7:{let a=people.slice(0,3).map(p=>ask(r(),p));return [...a,...shuffle(a).map(x=>listen(x.f,x.person))]}case 8:return people.slice(0,3).flatMap(p=>{let f=shuffle(foods).slice(0,2).join(' and ');return [ask(f,p),listen(f,p)]});case 9:{let a=shuffle(foods).slice(0,4);return [...people.slice(0,3).map((p,j)=>ask(a[j],p)),order(a[3],{instruction:'Find the missing food. Jordan wants the food no one ordered.',menu:a,prompt:Q,hidden:true})]}case 10:return [ {kind:'shop'} ];case 11:return [order('steak',{hidden:true,instruction:'Order steak.'}),order('noodles',{allowed:['pizza','noodles'],hidden:true,prompt:`Sorry, no steak today. We have pizza and noodles. ${Q}`}),ask(r(),'New guest')];default:{let a=shuffle(foods).slice(0,3);return [order(a[0],{allowed:a,hidden:true,prompt:`We have ${a.join(', ')}. ${Q}`}),ask(r(),'Mia'),ask(r(),'Jordan'),order('rice',{hidden:true,instruction:'Order rice.'}),order('soup',{hidden:true,instruction:'Sorry, no rice. Order soup.'})]}}}
function start(i){stop();mid=i;let run=data.runs[i];if(!run||run.finished)run=data.runs[i]={steps:build(i),idx:0,finished:false,records:[]};steps=run.steps;idx=run.idx;while(steps[idx]?.passed)idx++;run.idx=idx;save();render()}
function render(){stop();badge();let s=steps[idx];if(!s){finish();return}if(s.kind==='shop'){shop();return}let f=s.f;app.innerHTML=`<button class="secondary" onclick="map()">← Map</button><h2>${names[mid]}</h2><progress value="${idx}" max="${steps.length}"></progress><p>Task ${idx+1} of ${steps.length}</p><div class="panel center"><div class="emoji">${scene(mid,true)}</div><h2>${esc(s.person||'Chef')}</h2><div class="bubble">${s.hidden?'Listen carefully.':esc(s.prompt)}</div><button id="listen" class="secondary" onclick="say(steps[idx].prompt)">🔊 Listen</button><p>${esc(s.instruction||(s.kind==='ask'?'Ask the question.':'Order this food.'))}</p>${s.menu?`<p>${s.menu.map(esc).join(' · ')}</p>`:''}${s.kind==='order'&&!s.hidden?`<div class="foods"><div class="food"><img class="foodphoto" src="${photos[foods.indexOf(f)]||photos[0]}" alt="">${esc(f)}</div></div>`:''}${mid<6?'<button class="secondary" onclick="hint()">Need help?</button><p id="hint"></p>':''}${testPanel()}<button id="mic" onclick="speak()">🎙 Speak now!</button><div class="status" id="status" aria-live="polite"></div><p id="transcript" class="note"></p><div id="next"></div></div>`;if(s.kind==='ask'&&s.asked)showCheck(s);else if(s.kind==='order')say(s.prompt)}
function hint(){let s=steps[idx],t=s.kind==='ask'?Q:A(s.f);document.getElementById('hint').textContent=t;say(t)}
function norm(t){return t.toLowerCase().replace(/[’']/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim().replace(/^i would /,'id ')}function speak(){if(busy||speechSynthesis.speaking||steps[idx]?.passed||steps[idx]?.asked)return;closeTest();let meter=document.getElementById("soundMeter");if(meter)meter.value=0;let testStatus=document.getElementById("testStatus");if(testStatus)testStatus.textContent="Microphone test stopped. Starting speech recognition.";let R=window.SpeechRecognition||window.webkitSpeechRecognition;let status=document.getElementById('status');if(!R){status.textContent='Voice is not available. Try Chrome on a secure website.';return}speechSynthesis.cancel();let e=++epoch;rec=new R();rec.lang='en-US';rec.maxAlternatives=5;rec.interimResults=true;busy=true;document.getElementById('mic').disabled=true;status.textContent='Starting microphone...';rec.onstart=()=>{if(e===epoch)status.textContent='Starting... Wait for Ready!'};rec.onaudiostart=()=>{if(e===epoch)status.textContent='Ready! Speak now!'};rec.onspeechstart=()=>{if(e===epoch)status.textContent='Speech detected...'};rec.onresult=ev=>{if(e!==epoch)return;let result=ev.results[ev.resultIndex];if(!result.isFinal){document.getElementById('transcript').textContent='I hear: '+result[0].transcript;return}let s=steps[idx],alternatives=Array.from(result).map(x=>x.transcript),choices=s.kind==='ask'?[Q]:(s.allowed||[s.f]).map(A),match=choices.find(c=>alternatives.some(t=>norm(t)===norm(c)));document.getElementById('transcript').textContent='I heard: '+alternatives[0];if(match){s.actual=s.kind==='ask'?s.f:(s.allowed||[s.f]).find(f=>norm(A(f))===norm(match));pass(s)}else{status.textContent='Try again. Say the full sentence.'}};rec.onerror=ev=>{if(e!==epoch)return;const messages={'not-allowed':'Allow your microphone.','service-not-allowed':'Speech service is blocked.','audio-capture':'No microphone input.','network':'Speech service cannot connect.','no-speech':'No speech detected.','aborted':'Listening stopped.','language-not-supported':'English speech is not supported.'};status.textContent=(messages[ev.error]||'Speech error.')+' ('+ev.error+')';};rec.onend=()=>{if(e===epoch){busy=false;if(/^(Starting microphone|Starting|Listening|Ready|Speech detected)/.test(status.textContent))status.textContent='Listening ended without a result. Try again.';let b=document.getElementById('mic');if(b&&!steps[idx].passed&&!steps[idx].asked)b.disabled=false}};setTimeout(()=>{if(e!==epoch)return;try{rec.start()}catch(err){busy=false;document.getElementById('mic').disabled=false;status.textContent='Could not start: '+err.name+' — '+err.message}},350)}
function pass(s){if(s.passed)return;epoch++;busy=false;try{rec.abort()}catch(e){}rec=null;if(s.kind==='ask'&&!s.confirmed){s.asked=true;save();showCheck(s);return}s.passed=true;data.count++;if(s.kind==='order')for(let f of foods)if(s.actual.split(' and ').includes(f)&&!data.words.includes(f))data.words.push(f);data.runs[mid].records.push({person:s.person||'Me',food:s.actual});save();document.getElementById('status').textContent='Great job!';document.getElementById('mic').disabled=true;let next=document.getElementById('next');if(s.kind==='ask'){let t=A(s.f);next.innerHTML='<p>Listen. Write the food in your mission log.</p><button class="secondary" onclick="say(A(steps[idx].f))">🔊 Listen again</button><button onclick="advance()">Next task →</button>';}else{next.innerHTML='<p>Write your order in your mission log.</p><button onclick="advance()">Next task →</button>';say('Great job! Here you are!')}}
function showCheck(s){document.getElementById('status').textContent='Great question! Listen to your guest.';document.getElementById('mic').disabled=true;let choices=s.f.includes(' and ')?[s.f,...shuffle(foods.filter(f=>!s.f.includes(f))).slice(0,4).reduce((a,f,i,ar)=>i%2?a:[...a,f+' and '+ar[i+1]],[])]:[s.f,...shuffle(foods.filter(f=>f!==s.f)).slice(0,3)];let next=document.getElementById('next');next.innerHTML='<p>Write the food in your mission log. Then choose the order.</p><button class="secondary" onclick="say(A(steps[idx].f))">Listen again</button><div class="foods" id="checks"></div><p id="checkStatus" aria-live="polite"></p>';shuffle(choices).forEach(f=>{let b=document.createElement('button');b.className='secondary';b.textContent=f;b.onclick=()=>{if(f!==s.f){document.getElementById('checkStatus').textContent='Listen again. Try again.';return}s.confirmed=true;pass(s)};document.getElementById('checks').append(b)});say(A(s.f))}
function advance(){idx++;data.runs[mid].idx=idx;save();render()}function finish(){let run=data.runs[mid];run.finished=true;let code=data.done[mid]||String(Math.floor(1000+Math.random()*9000));data.done[mid]=code;save();badge();app.innerHTML=`<div class="hero"><div class="emoji">🏆</div><h1>Mission complete!</h1><p>Write your secret code.</p><h1>${code}</h1><p>${data.words.length}/8 foods spoken · ${data.count} speaking tasks</p><button onclick="map()">Back to map</button></div>`}
let cart=[];const prices=[40,20,25,70,35,30,35,25];function shop(){cart=[];app.innerHTML=`<button class="secondary" onclick="map()">Map</button><div class="panel"><h2>Food Shopping</h2><p>You have 100 coins. Buy 3 different foods. Buy some soup.</p><div id="shop"></div></div>`;drawShop()}function drawShop(){let total=cart.reduce((s,i)=>s+prices[i],0);document.getElementById('shop').innerHTML=`<div class="foods">${foods.map((f,i)=>`<button class="${cart.includes(i)?'':'secondary'}" onclick="toggleFood(${i})">${icons[i]} ${f}<br>${prices[i]} coins</button>`).join('')}</div><p>Total: ${total} coins</p><button ${cart.length===3&&cart.includes(2)&&total<=100?'':'disabled'} onclick="buy()">Order your food</button>`}function toggleFood(i){cart=cart.includes(i)?cart.filter(x=>x!==i):[...cart,i];drawShop()}function buy(){steps.splice(idx,1,...cart.map(i=>order(foods[i],{instruction:`Order ${foods[i]}. Write ${prices[i]} coins in your mission log.`})));save();render()}
function rows(n){return Array.from({length:n},()=>'<tr><td>____________</td><td>____________________</td></tr>').join('')}function passport(){stop();app.innerHTML=`<div class="noPrint"><button onclick="map()">Back to map</button><button onclick="window.print()">Print mission logs</button></div><section class="sheet"><h1>Food City — Mission Log</h1><p>Class: ______ No.: ______ Name: __________________</p><h2>A. Speak and write.</h2><p>I'd like some __________________, please.</p><table><tr><th>Mission</th><th>My orders (write each food)</th><th>Code</th></tr>${names.slice(0,6).map((n,i)=>`<tr><td>${i+1}. ${n}</td><td>${[2,2,0,2,0,3][i]?Array.from({length:[2,2,0,2,0,3][i]},()=> '__________').join(' / '):'Ask only'}</td><td>______</td></tr>`).join('')}</table><h2>B. Ask, listen and write.</h2><p>What would you like to eat?</p><table><tr><th>Mission</th><th>Guest</th><th>Food</th></tr>${[[3,'Alex'],[3,'Mia'],[4,'Sam'],[4,'Jordan'],[5,'Alex'],[5,'Mia'],[5,'Sam'],[5,'Jordan'],[6,'Alex'],[6,'Mia'],[6,'Jordan']].map(([m,g])=>`<tr><td>${m}</td><td>${g}</td><td>________________</td></tr>`).join('')}</table><p>Check the foods you said: ${foods.map(f=>'□ '+f).join(' · ')}</p><p>□ I can ask.　□ I can answer.　□ I can listen and write.</p></section><section class="sheet"><h1>Food City — Challenge Log</h1><p>Class: ______ No.: ______ Name: __________________</p>${names.slice(6).map((n,i)=>`<h3>${i+1}. ${n} — Code: ______</h3><p>${['Write the three menus and your orders.','Write Alex, Mia and Sam’s food.','Write two foods for each guest.','Write three orders and the missing food.','Write three foods, prices and total coins.','Write your first order, new order and guest’s food.','Write your five task answers.'][i]}</p>${Array.from({length:[3,3,3,4,3,3,5][i]},(_,j)=>`<p>${j+1}. ____________________________________________________</p>`).join('')}`).join('')}</section>`}home();</script></html>
